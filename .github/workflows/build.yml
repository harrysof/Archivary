name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Archivary-windows
            path: dist/Archivary.exe
          - os: macos-latest
            artifact: Archivary-macos
            path: Archivary-macos.zip
          - os: ubuntu-latest
            artifact: Archivary-linux
            path: Archivary-linux.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Generate app icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_icons.py

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/archivary.spec --noconfirm

      - name: Package macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Archivary.app Archivary-macos.zip

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -czf Archivary-linux.tar.gz -C dist Archivary

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Archivary-windows/Archivary.exe
            artifacts/Archivary-linux/Archivary-linux.tar.gz
            artifacts/Archivary-macos/Archivary-macos.zip
